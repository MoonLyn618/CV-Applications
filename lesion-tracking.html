<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>同一个病灶，如何找回来？</title>
<style>
:root{--blue:#174b87;--ink:#16304e;--muted:#677b91;--line:#d9e3ed;--accent:#d8963d}*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif}main{max-width:1440px;margin:auto;padding:28px 34px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:32px;margin:8px 0}header small{color:var(--muted);letter-spacing:2px}.tools{display:flex;gap:8px}button{font:inherit;cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);border-radius:9px;padding:11px 18px}button:hover{background:#e9f1fb}button:focus-visible{outline:3px solid var(--accent)}button.active,.primary{background:var(--blue);color:white;border-color:var(--blue)}nav{display:flex;gap:10px;margin:24px 0 18px}nav button{flex:1;text-align:left;padding:15px 18px;font-size:18px}nav b{margin-right:12px;opacity:.65}.question{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 16px}.question h2{font-size:23px;margin:0}.question p{margin:6px 0 0;color:var(--muted);font-size:16px}.scene{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{position:relative;background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden}.panel h3{font-size:19px;padding:18px 22px;margin:0;border-bottom:1px solid #edf1f6}.badge{float:right;color:var(--muted);font-size:14px;font-weight:normal}.panel svg{display:block;width:100%;height:auto;max-height:385px;touch-action:none}.overlay{cursor:grab}.overlay:active{cursor:grabbing}.legend{padding:10px 22px 16px;font-size:15px;min-height:44px;color:var(--muted)}.dot{display:inline-block;width:10px;height:10px;background:var(--blue);border-radius:50%;margin-right:6px}.orange{background:var(--accent)}.controls{display:flex;align-items:center;gap:12px;padding:12px 22px;background:#f9fbfd;flex-wrap:wrap}input[type=range]{accent-color:var(--blue);width:135px}.controls label{font-size:14px}.controls button{padding:7px 12px;font-size:14px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-top:16px}.card{border:2px solid var(--line);border-radius:12px;background:white;text-align:left;overflow:hidden;padding:0}.card h3{font-size:18px;padding:12px 15px;margin:0}.card svg{width:100%;height:125px;display:block}.card p{margin:8px 15px 14px;color:var(--muted);font-size:14px;min-height:22px}.card.selected{border-color:var(--accent);box-shadow:0 0 0 2px #d8963d22}.card.correct{border-color:var(--blue)}.bottom{display:flex;align-items:center;justify-content:space-between;gap:15px;background:#e7eef7;border-radius:12px;padding:18px 22px;margin-top:18px}.bottom strong{font-size:21px}.actions{display:flex;gap:10px;flex-shrink:0}footer{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:14px;gap:20px}.hidden{display:none!important}@media(max-width:800px){main{padding:18px}h1{font-size:24px}.scene{gap:10px}.panel h3{padding:12px}.badge{display:none}nav button{font-size:14px;padding:12px 8px}.cards{grid-template-columns:repeat(2,1fr)}.bottom{align-items:flex-start;flex-direction:column}.question{align-items:flex-start;flex-direction:column}header{align-items:flex-start}.tools button{padding:8px}.bottom strong{font-size:18px}}
.gray{background:#8297a9}.vessels-on .vessel-tree,.vessels-on .vessel-tree path{stroke:#466986}.vessel-label{pointer-events:none}.vessel-label text{fill:#375675;font-size:17px;font-weight:bold;paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round}.vessel-label path{fill:none;stroke:#637e99;stroke-width:2}.vessel-label circle{fill:#637e99;stroke:white;stroke-width:2}.card .vessel-label text{font-size:16px}</style></head><body><main>
<header><div><small>计算机视觉 · 病灶追踪</small><h1>同一个病灶，如何找回来？</h1></div><div class="tools"><button id="vessels" aria-pressed="false">突出血管</button><button id="reset">重置</button><button id="full">全屏</button></div></header>
<nav aria-label="演示步骤"><button data-step="0"><b>01</b>位置差异</button><button data-step="1"><b>02</b>配准之后</button><button data-step="2"><b>03</b>外观匹配</button></nav>
<section class="question"><div><h2 id="question"></h2><p id="hint"></p></div><button id="align" class="primary">对齐血管分叉参照点</button></section>
<section class="scene"><div class="panel"><h3>基线检查<span class="badge">已知目标 A</span></h3><svg id="base" viewBox="0 0 560 400" role="img" aria-label="基线肺部及目标病灶A"></svg><div class="legend"><span class="dot"></span>目标 A　　<span class="dot gray"></span>灰色：肺血管（示意）</div></div><div class="panel"><h3>复查检查<span class="badge" id="stageBadge"></span></h3><svg id="follow" viewBox="0 0 560 400" role="img" aria-label="复查肺部和可拖动的基线透明参照片"></svg><div class="legend"><span class="dot orange"></span>虚线：基线参照片　<span class="dot"></span>蓝色：复查候选　<span class="dot gray"></span>灰色：血管</div><div class="controls"><label>叠片旋转 <input id="rotation" type="range" min="-15" max="15" value="8" aria-label="旋转透明叠片"></label><label>透明度 <input id="opacity" type="range" min="10" max="85" value="55" aria-label="叠片透明度"></label><button id="toggle">隐藏叠片</button></div></div></section>
<section class="cards hidden" id="cards" aria-label="放大病灶比较"></section>
<section class="bottom"><strong id="message" aria-live="polite"></strong><div class="actions"><button id="reveal" class="hidden">揭晓对应关系</button><button class="primary" id="next">下一步 →</button></div></section>
<footer><span>教学示意：候选对应关系预设；配准动作仅模拟整体对齐，未运行DLT或真实配准算法。</span><span>← → 切换步骤 · F 全屏 · R 重置</span></footer>
</main><script>
const $=s=>document.querySelector(s);let step=0,selected=null,revealed=false,tx=34,ty=-20,angle=8,show=true;let drag=null,raf=null;
const lung='M267 40 C242 45 220 67 201 96 C153 99 111 153 90 224 C75 273 71 323 75 356 C139 373 217 365 256 344 L270 173 L283 344 C337 368 422 374 487 352 C491 275 465 194 415 143 C388 116 361 108 338 97 C317 65 293 45 283 40 Z';
function anatomy(){return `<path d="${lung}" fill="#eef2f5" stroke="#c5cfd9" stroke-width="3"/><g class="vessel-tree" fill="none" stroke="#8297a9" stroke-linecap="round"><path d="M276 48 L276 168 L210 224 L166 281 M276 168 L339 217 L390 274" stroke-width="17"/><path d="M246 191 L185 168 L141 140 M220 215 L161 215 L110 242 M202 236 L209 287 L181 336 M315 195 L371 176 L416 153 M337 216 L407 219 L454 243 M359 240 L341 286 L316 339 M389 273 L432 310 L463 332" stroke-width="10"/><path d="M183 168 L171 125 M162 215 L140 193 M209 287 L241 320 M371 176 L364 136 M407 219 L425 193 M341 286 L364 326 M432 310 L433 345" stroke-width="6"/></g><circle cx="276" cy="168" r="6" fill="#174b87"/><text x="290" y="157" fill="#677b91" font-size="16">血管分叉参照点</text>`}
function vesselLabels(follow=false){return `<g class="vessel-label"><path d="M88 93 L142 103 L184 166"/><circle cx="184" cy="166" r="4"/><text x="38" y="82">肺血管（示意）</text><path d="M454 382 L454 359 L${follow?399:390} ${follow?305:274}"/><circle cx="${follow?399:390}" cy="${follow?305:274}" r="4"/><text x="306" y="389">病灶周围血管</text></g>`}
function blob(x,y,type=0,scale=1){let parts=type===2?[[0,0,10],[-12,0,8],[12,-1,8],[23,-1,6]]:type===1?[[0,0,13],[-9,5,9],[8,7,10],[4,-10,8],[-8,-7,7]]:[[0,0,12],[-9,2,8],[7,7,9],[5,-9,8],[-6,-7,6]];return `<g transform="translate(${x} ${y}) scale(${scale})" fill="#2878bb" stroke="#145289" stroke-width="1.3">${parts.map(([a,b,r])=>`<circle cx="${a}" cy="${b}" r="${r}"/>`).join('')}<circle cx="-3" cy="-4" r="5" fill="#6db4df" stroke="none" opacity=".6"/></g>`}
function label(x,y,t){return `<text x="${x}" y="${y}" fill="#174b87" font-size="20" font-weight="bold">${t}</text>`}
$('#base').innerHTML=anatomy()+blob(377,279)+label(401,273,'A')+blob(127,249,1,.75)+label(103,227,'B')+vesselLabels();
$('#follow').innerHTML=anatomy()+`<path d="M359 240 Q368 289 399 305" fill="none" class="vessel-tree" stroke="#8297a9" stroke-width="10" stroke-linecap="round"/>`+blob(397,307,1)+label(420,331,'①')+blob(337,316)+label(309,349,'②')+blob(378,272,2,.9)+label(403,263,'③')+blob(127,249,1,.75)+label(103,227,'B′')+`<g id="overlay" class="overlay" opacity=".55"><path d="${lung}" fill="#d8963d" fill-opacity=".055" stroke="#d8963d" stroke-width="3" stroke-dasharray="9 7"/><path d="M276 48 L276 168 L210 224 M276 168 L339 217 L390 274" fill="none" stroke="#d8963d" stroke-width="3" stroke-dasharray="7 5"/><circle cx="276" cy="168" r="11" fill="#d8963d" fill-opacity=".25" stroke="#d8963d" stroke-width="3"/><circle cx="377" cy="279" r="23" fill="none" stroke="#d8963d" stroke-width="3" stroke-dasharray="7 5"/><text x="320" y="235" fill="#996426" font-size="16">预计位置</text></g>`+vesselLabels(true);
function transform(){ $('#overlay').setAttribute('transform',`translate(${tx} ${ty}) rotate(${angle} 276 168)`);$('#rotation').value=angle;}
function cardSvg(i){let kind=i===3?2:i===1?1:0;let fork=i===2?`<path d="M65 88 L124 54 L197 87 M124 54 L146 19"/>`:`<path d="M80 15 L128 64 L192 105 M128 64 L179 41"/>`;return `<svg viewBox="0 0 260 130" role="img" aria-label="${i===0?'目标A':'候选'+i}外观及周围血管"><g class="vessel-tree" stroke="#8297a9" stroke-width="13" fill="none" stroke-linecap="round">${fork}</g>${blob(151,84,kind,i===1?1.35:1.2)}<g class="vessel-label"><text x="196" y="26">血管</text><path d="M202 33 L${i===2?172:179} ${i===2?76:41}"/><circle cx="${i===2?172:179}" cy="${i===2?76:41}" r="3"/></g></svg>`}
function cards(){const labels=['基线目标 A','候选 ①','候选 ②','候选 ③'];$('#cards').innerHTML=labels.map((t,i)=>`<${i?'button':'div'} class="card ${selected===i?'selected':''} ${revealed&&i===1?'correct':''}" ${i?`data-candidate="${i}" aria-pressed="${selected===i}"`:''}><h3>${t}${revealed&&i===1?' · 对应目标':''}</h3>${cardSvg(i)}<p>${revealed?['对照：病灶形态与血管关系','外观变化，血管关系仍相近','外观相似，血管关系不同','位置接近，形态差异明显'][i]:i?'点击选择，再说明依据':'作为比较参照'}</p></${i?'button':'div'}>`).join('');$('#cards').querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.candidate);cards();message()});}
function message(){ $('#message').textContent=step===0?'位置变了：直接比较，会混入位置差异。':step===1?'大致位置找到了：离预计位置最近的，一定是它吗？':revealed?'结合位置、病灶外观及周围血管关系，再确认对应病灶。':selected?`你选择了候选 ${['','①','②','③'][selected]}。依据是什么？`:'同一病灶外观会变，不同病灶也可能相似。';}
function render(){document.querySelectorAll('[data-step]').forEach(b=>{b.classList.toggle('active',Number(b.dataset.step)===step);b.setAttribute('aria-current',Number(b.dataset.step)===step?'step':'false')});$('#question').textContent=['两次检查，病灶为什么不在原来的位置？','血管主干对齐了，就能确认同一个病灶吗？','加入外观证据，你会选哪一个？'][step];$('#hint').textContent=['拖动右侧透明叠片，或调节旋转，观察两次位置的错开。','虚线圆提供预计位置；局部仍有偏差，附近也有相似干扰。','比较病灶形态及周围血管的分叉、走向，再选择候选。'][step];$('#stageBadge').textContent=['基线叠片尚未对齐','已获得位置线索','综合位置与外观'][step];$('#align').classList.toggle('hidden',step!==0);$('#cards').classList.toggle('hidden',step!==2);$('#reveal').classList.toggle('hidden',step!==2);$('#next').textContent=step===2?'重新演示 ↻':'下一步 →';$('#reveal').textContent=revealed?'隐藏答案':'揭晓对应关系';cards();message();}
function go(n){step=Math.max(0,Math.min(2,n));if(step>0){tx=0;ty=0;angle=0;transform()}render()}
function align(){if(raf)cancelAnimationFrame(raf);const initial=[tx,ty,angle],start=performance.now();function frame(now){let t=Math.min(1,(now-start)/650),ease=1-Math.pow(1-t,3);[tx,ty,angle]=initial.map(v=>v*(1-ease));transform();if(t<1)raf=requestAnimationFrame(frame);else{raf=null;go(1)}}raf=requestAnimationFrame(frame)}
function reset(){if(raf)cancelAnimationFrame(raf);raf=null;step=0;selected=null;revealed=false;tx=34;ty=-20;angle=8;show=true;$('#overlay').style.display='';$('#toggle').textContent='隐藏叠片';$('#opacity').value=55;$('#overlay').setAttribute('opacity','.55');transform();render()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{if(raf)cancelAnimationFrame(raf);go(Number(b.dataset.step))});$('#align').onclick=align;$('#next').onclick=()=>step===2?reset():step===0?align():go(2);$('#reset').onclick=reset;$('#reveal').onclick=()=>{revealed=!revealed;render()};$('#rotation').oninput=e=>{angle=Number(e.target.value);transform()};$('#opacity').oninput=e=>$('#overlay').setAttribute('opacity',e.target.value/100);$('#toggle').onclick=()=>{show=!show;$('#overlay').style.display=show?'':'none';$('#toggle').textContent=show?'隐藏叠片':'显示叠片'};
function point(e){const p=$('#follow').createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform($('#follow').getScreenCTM().inverse())}$('#overlay').onpointerdown=e=>{if(raf)cancelAnimationFrame(raf);const p=point(e);drag={x:p.x,y:p.y,tx,ty};$('#overlay').setPointerCapture(e.pointerId)};$('#overlay').onpointermove=e=>{if(!drag)return;const p=point(e);tx=Math.max(-120,Math.min(120,drag.tx+p.x-drag.x));ty=Math.max(-90,Math.min(90,drag.ty+p.y-drag.y));transform()};$('#overlay').onpointerup=$('#overlay').onpointercancel=()=>drag=null;
$('#vessels').onclick=()=>{const on=document.querySelector('main').classList.toggle('vessels-on');$('#vessels').setAttribute('aria-pressed',String(on));$('#vessels').textContent=on?'恢复血管显示':'突出血管'};
async function full(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{$('#full').textContent='请用浏览器全屏'}}$('#full').onclick=full;document.onkeydown=e=>{if(e.target.matches('input,button'))return;if(e.key==='ArrowRight'){e.preventDefault();$('#next').click()}if(e.key==='ArrowLeft')go(step-1);if(e.key.toLowerCase()==='r')reset();if(e.key.toLowerCase()==='f')full()};transform();render();
</script></body></html>
